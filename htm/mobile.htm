{{template "/htm/header.htm" . }}

<script>
  function mobileDashboard() {
    return {
      is_running: {{ if .status.Status }}true{{ else }}false{{ end }},
      players: {{ .status.Players }},
      public_ip: "{{ .status.PublicIp }}",
      console_text: "",
      tmp_loc: "{{ .tmpLoc }}",
      current_cars: [],
      session: {
        name: "",
        type: "",
        index: 0,
        session_count: 0,
        track: "",
        track_config: "",
        server_name: "",
        time: 0,
        laps: 0,
        wait_time: 0,
        ambient_temp: 0,
        road_temp: 0,
        weather_graphics: "",
        elapsed_ms: 0
      },
      current_event: {
        id: 0,
        category: "",
        track: "",
        track_key: "",
        track_config: "",
        class: "",
        class_id: 0,
        time: "",
        time_id: 0,
        started_at: 0
      },
      config_filled: {{ if .config_filled }}true{{ else }}false{{ end }},
      confirm: { show: false, action: "" },
      notice: "",

      apply(json) {
        this.is_running = json.is_running;
        this.players = json.players;
        this.public_ip = json.public_ip || "";
        this.console_text = json.text || "";
        this.tmp_loc = json.tmp_loc || this.tmp_loc;
        this.session = json.session || this.session;
        this.current_event = json.current_event || this.current_event;
        this.current_cars = json.current_cars || [];
      },

      fetch_status() {
        fetch("/api/server/status")
          .then((r) => r.json())
          .then((j) => this.apply(j));
      },

      start_loop() {
        this.fetch_status();
        setInterval(() => this.fetch_status(), 1000);
      },

      ask_confirm(action) {
        this.confirm = { show: true, action };
        document.body.style.overflow = "hidden";
      },

      dismiss_confirm() {
        this.confirm = { show: false, action: "" };
        document.body.style.overflow = "";
      },

      do_confirmed() {
        const action = this.confirm.action;
        this.dismiss_confirm();
        if (action === "start") this.start_server();
        if (action === "stop")  this.stop_server();
      },

      confirm_title() {
        if (this.confirm.action === "start") return "Start server?";
        if (this.confirm.action === "stop")  return "Stop server?";
        return "";
      },

      confirm_desc() {
        if (this.confirm.action === "start") return "The server will start with the next queued event.";
        if (this.confirm.action === "stop")  return "The current session will end immediately.";
        return "";
      },

      start_server() {
        fetch("/api/server/start")
          .then((r) => r.json())
          .then((j) => this.apply(j));
      },

      stop_server() {
        fetch("/api/server/stop")
          .then((r) => r.json())
          .then((j) => this.apply(j));
      },

      // Format a raw car key like "ferrari_488_gt3" → "Ferrari 488 Gt3"
      fmt_car_key(key) {
        if (!key) return "";
        return key.replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
      },

      // Parse "05_time=36000_mult=2_start=... Day" into "Day · 10:00 · 2×"
      fmt_weather(str) {
        if (!str) return "—";
        if (!str.includes("time=") && !str.includes("mult=")) return str;
        const sp = str.indexOf(" ");
        const key = sp >= 0 ? str.slice(0, sp) : str;
        const name = sp >= 0 ? str.slice(sp + 1).trim() : "";
        const parts = name ? [name] : [];
        const tm = key.match(/time=(\d+)/);
        if (tm) {
          const s = parseInt(tm[1]);
          const h = Math.floor(s / 3600);
          const m = Math.floor((s % 3600) / 60);
          parts.push(String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0"));
        }
        const ml = key.match(/mult=(\d+(?:\.\d+)?)/);
        if (ml) {
          const v = parseFloat(ml[1]);
          if (v !== 1) parts.push(v + "×");
        }
        return parts.length ? parts.join(" · ") : str;
      },

      uptime_label() {
        if (!this.current_event.started_at) return "00:00:00";
        const s = Math.max(0, Math.floor(Date.now() / 1000) - this.current_event.started_at);
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = s % 60;
        return [h, m, sec].map((n) => String(n).padStart(2, "0")).join(":");
      },

      elapsed_label() {
        const total = Math.max(0, Math.floor((this.session.elapsed_ms || 0) / 1000));
        const m = Math.floor(total / 60);
        const s = total % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      },

      format_label() {
        if (this.session.laps && this.session.laps > 0) return this.session.laps + " laps";
        if (this.session.time && this.session.time > 0) return this.session.time + " min";
        return "Open";
      },

      session_index_label() {
        const idx = (this.session.index || 0) + 1;
        const total = this.session.session_count || 1;
        return idx + " / " + total;
      },

      quick_log_lines() {
        if (!this.console_text) return [];
        return this.console_text.trim().split("\n").filter(Boolean).slice(-5).reverse();
      }
    };
  }
</script>

<div x-data="mobileDashboard()" x-init="start_loop()">
<div class="mob">

  <!-- ── Status card ────────────────────────────────── -->
  <div class="mob-status" :class="is_running ? 'mob-status--live' : ''">
    <div class="mob-status__top">
      <div class="mob-status__badge">
        <span class="mob-status__dot"></span>
        <span x-text="is_running ? 'Live' : 'Idle'"></span>
      </div>
      <div class="mob-status__players">
        <span x-text="players"></span>
        <i class="fas fa-circle" style="font-size:5px; opacity:0.4;"></i>
        <span style="font-size:11px; color:#475569;">players</span>
      </div>
    </div>

    <div class="mob-status__track" x-text="current_event.track || session.track || 'Server standby'"></div>
    <div class="mob-status__sub" x-text="current_event.category || session.server_name || 'No event running'"></div>

    <div class="mob-status__metrics">
      <div class="mob-metric">
        <span class="mob-metric__val" x-text="uptime_label()"></span>
        <span class="mob-metric__lbl">Uptime</span>
      </div>
      <div class="mob-metric">
        <span class="mob-metric__val" x-text="session_index_label()"></span>
        <span class="mob-metric__lbl">Session</span>
      </div>
      <div class="mob-metric">
        <span class="mob-metric__val" x-text="format_label()"></span>
        <span class="mob-metric__lbl">Format</span>
      </div>
    </div>

    <div class="mob-status__actions">
      <button class="mob-btn mob-btn--ghost mob-btn--icon" type="button"
        :disabled="!config_filled" @click="fetch_status()" title="Refresh">
        <i class="fas fa-sync-alt"></i>
      </button>
      <button class="mob-btn mob-btn--start" type="button"
        x-show="!is_running" :disabled="!config_filled" @click="ask_confirm('start')">
        <i class="fas fa-play"></i> Start server
      </button>
      <button class="mob-btn mob-btn--stop" type="button"
        x-show="is_running" :disabled="!config_filled" @click="ask_confirm('stop')">
        <i class="fas fa-stop"></i> Stop server
      </button>
    </div>
  </div>

  <!-- ── Action tiles ───────────────────────────────── -->
  <div class="mob-tiles">
    <a class="mob-tile" href="{{ if .config_filled }}/mobile/track{{ else }}#{{ end }}"
      style="{{ if not .config_filled }}opacity:0.4;pointer-events:none;{{ end }}">
      <div class="mob-tile__top">
        <span class="mob-tile__lbl">Track</span>
        <i class="fas fa-chevron-right mob-tile__arrow"></i>
      </div>
      <span class="mob-tile__val" x-text="current_event.track || session.track || '—'"></span>
      <span class="mob-tile__sub" x-text="current_event.track_config || session.track_config || 'default'"></span>
    </a>
    <a class="mob-tile" href="{{ if .config_filled }}/mobile/cars{{ else }}#{{ end }}"
      style="{{ if not .config_filled }}opacity:0.4;pointer-events:none;{{ end }}">
      <div class="mob-tile__top">
        <span class="mob-tile__lbl">Cars</span>
        <i class="fas fa-chevron-right mob-tile__arrow"></i>
      </div>
      <div class="mob-tile__chips" x-show="current_cars.length > 0">
        <template x-for="(entry, i) in current_cars.slice(0, 5)" :key="entry.cache_car_key">
          <span class="mob-tile__chip" x-text="fmt_car_key(entry.cache_car_key)"></span>
        </template>
        <span class="mob-tile__chip mob-tile__chip--more"
          x-show="current_cars.length > 5"
          x-text="'+' + (current_cars.length - 5) + ' more'"></span>
      </div>
      <span class="mob-tile__val" x-show="current_cars.length === 0"
        x-text="current_event.class || '—'"></span>
      <span class="mob-tile__sub"
        x-text="current_cars.length > 0 ? current_cars.length + ' cars · ' + (current_event.class || 'Car class') : 'Car class'"></span>
    </a>
    <a class="mob-tile" href="{{ if .config_filled }}/mobile/weather{{ else }}#{{ end }}"
      style="{{ if not .config_filled }}opacity:0.4;pointer-events:none;{{ end }}">
      <div class="mob-tile__top">
        <span class="mob-tile__lbl">Weather</span>
        <i class="fas fa-chevron-right mob-tile__arrow"></i>
      </div>
      <span class="mob-tile__val" x-text="fmt_weather(session.weather_graphics) || current_event.time || '—'"></span>
      <span class="mob-tile__sub" x-text="current_event.time || 'Time preset'"></span>
    </a>
  </div>

  <!-- ── Session details ────────────────────────────── -->
  <div class="mob-card">
    <div class="mob-card__head">
      <span>Session</span>
      <span x-text="session.type || 'Waiting'"></span>
    </div>
    <div class="mob-rows">
      <div class="mob-row">
        <span>Elapsed</span>
        <strong class="mob-row__mono" x-text="elapsed_label()"></strong>
      </div>
      <div class="mob-row">
        <span>Ambient</span>
        <strong x-text="(session.ambient_temp || 0) + '°C'"></strong>
      </div>
      <div class="mob-row">
        <span>Road temp</span>
        <strong x-text="(session.road_temp || 0) + '°C'"></strong>
      </div>
      <div class="mob-row">
        <span>Time preset</span>
        <strong x-text="current_event.time || '—'"></strong>
      </div>
      <div class="mob-row">
        <span>Public IP</span>
        <strong class="mob-row__mono" x-text="public_ip || '—'"></strong>
      </div>
    </div>
  </div>

  <!-- ── Notice ─────────────────────────────────────── -->
  <template x-if="notice">
    <div class="mob-notice" x-text="notice"></div>
  </template>

  <!-- ── Log ───────────────────────────────────────── -->
  <div class="mob-card">
    <div class="mob-card__head">
      <span>Server log</span>
      <span x-text="quick_log_lines().length + ' lines'"></span>
    </div>
    <div class="mob-log">
      <template x-if="quick_log_lines().length === 0">
        <div class="mob-log__empty">No server output yet.</div>
      </template>
      <template x-for="(line, i) in quick_log_lines()" :key="i">
        <div class="mob-log__line" x-text="line"></div>
      </template>
    </div>
  </div>

</div><!-- /.mob -->

  <!-- ── Confirm dialog ────────────────────────────── -->
  <div class="mob-confirm-bd" x-show="confirm.show" x-cloak @click="dismiss_confirm()"></div>
  <div class="mob-confirm" x-show="confirm.show" x-cloak>
    <div class="mob-confirm__title" x-text="confirm_title()"></div>
    <div class="mob-confirm__desc" x-text="confirm_desc()"></div>
    <div class="mob-confirm__actions">
      <button class="mob-btn mob-btn--ghost" type="button" @click="dismiss_confirm()">Cancel</button>
      <button class="mob-btn" type="button"
        :class="confirm.action === 'stop' ? 'mob-btn--stop' : 'mob-btn--start'"
        @click="do_confirmed()"
        x-text="confirm.action === 'stop' ? 'Stop' : 'Start'"></button>
    </div>
  </div>

</div><!-- /x-data wrapper -->

{{ template "/htm/footer.htm" }}
