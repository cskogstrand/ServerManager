<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Cars · ServerManager</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link href="/static/css/main.css" rel="stylesheet" />
  <link href="/static/css/extra.css" rel="stylesheet" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/js/all.min.js" crossorigin="anonymous"></script>
</head>
<body class="mob-page-body">

<script>
  function carsPage() {
    return {
      cars: {{ .car_data }},
      entries: [],
      search: "",
      sort_by: "name",
      brand_filter: "all",
      class_filter: "all",
      quick_filter: "all",
      chip_limit: null,
      show_all_chips: false,
      render_count: 40,
      render_step: 40,
      render_observer: null,
      saving: false,
      notice: "",
      current_event_id: 0,
      is_running: false,

      init() {
        this.$watch("entries", () => {
          this.show_all_chips = false;
          this.$nextTick(() => this.measure_chip_limit());
        });
        ["search", "sort_by", "brand_filter", "class_filter", "quick_filter"].forEach((key) => {
          this.$watch(key, () => this.reset_render_count());
        });
        window.addEventListener("resize", () => {
          this.$nextTick(() => this.measure_chip_limit());
        });

        fetch("/api/server/status")
          .then((r) => r.json())
          .then((j) => {
            this.is_running = j.is_running || false;
            const ev = j.current_event || {};
            this.current_event_id = ev.id || 0;
            const live = (j.current_cars || []).filter((e) => e.cache_car_key);
            if (live.length > 0) {
              this.entries = live.map((e) => ({
                cache_car_key: e.cache_car_key,
                skin_key: e.skin_key || this.first_skin(e.cache_car_key)
              }));
              this.$nextTick(() => {
                this.scroll_to_first_selected();
                this.measure_chip_limit();
                this.setup_render_observer();
              });
            } else {
              const classId = ev.class_id || 0;
              if (classId) {
                fetch("/api/class/" + classId)
                  .then((r) => r.json())
                  .then((jc) => {
                    this.entries = ((jc.data || {}).entries || [])
                      .map((e) => ({
                        cache_car_key: e.cache_car_key,
                        skin_key: e.skin_key || this.first_skin(e.cache_car_key)
                      }))
                      .filter((e) => e.cache_car_key && e.skin_key);
                    this.$nextTick(() => {
                      this.scroll_to_first_selected();
                      this.measure_chip_limit();
                      this.setup_render_observer();
                    });
                  });
              }
            }
          });
      },

      setup_render_observer() {
        if (this.render_observer) this.render_observer.disconnect();
        if (!this.$refs.renderMore) return;
        this.render_observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) this.load_more();
          });
        }, { root: this.$refs.resultsBody, rootMargin: "200px 0px" });
        this.render_observer.observe(this.$refs.renderMore);
      },

      reset_render_count() {
        this.render_count = this.render_step;
        this.$nextTick(() => this.setup_render_observer());
      },

      load_more() {
        this.render_count += this.render_step;
      },

      scroll_to_first_selected() {
        const el = document.querySelector(".mob-choice.is-on");
        if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      },

      first_skin(carKey) {
        const car = this.cars.find((c) => c.key === carKey);
        if (!car || !car.skins || car.skins.length === 0) return "";
        return car.skins[0].key || "";
      },

      is_selected(carKey) {
        return this.entries.some((e) => e.cache_car_key === carKey);
      },

      toggle(car) {
        if (this.is_selected(car.key)) {
          this.entries = this.entries.filter((e) => e.cache_car_key !== car.key);
          return;
        }
        const skin = this.first_skin(car.key);
        if (!skin) return;
        this.entries.push({ cache_car_key: car.key, skin_key: skin });
      },

      car_name(carKey) {
        const car = this.cars.find((c) => c.key === carKey);
        return (car && (car.name || car.key)) || carKey;
      },

      remove(carKey) {
        this.entries = this.entries.filter((e) => e.cache_car_key !== carKey);
      },

      chip_entries() {
        if (this.show_all_chips || this.hidden_chip_count() === 0) return this.entries;
        return this.entries.slice(0, this.chip_limit);
      },

      hidden_chip_count() {
        if (this.show_all_chips || this.chip_limit === null) return 0;
        return Math.max(this.entries.length - this.chip_limit, 0);
      },

      measure_chip_limit() {
        const wrap = this.$refs.chipWrap;
        const measure = this.$refs.chipMeasure;
        const more = this.$refs.chipMeasureMore;
        if (!wrap || !measure || !more || this.show_all_chips) return;
        if (this.entries.length === 0) {
          this.chip_limit = null;
          return;
        }

        const available = wrap.clientWidth;
        if (!available) return;

        const chips = Array.from(measure.querySelectorAll("[data-chip-measure]"));
        const gap = 7;
        const widths = chips.map((chip) => Math.ceil(chip.getBoundingClientRect().width));
        const moreWidth = Math.ceil(more.getBoundingClientRect().width);
        let used = 0;
        let visible = 0;

        for (let i = 0; i < widths.length; i++) {
          const remaining = widths.length - (i + 1);
          const chipWidth = widths[i] + (visible > 0 ? gap : 0);
          const reserve = remaining > 0 ? gap + moreWidth : 0;
          if ((used + chipWidth + reserve) > available) break;
          used += chipWidth;
          visible += 1;
        }

        if (visible >= this.entries.length) {
          this.chip_limit = this.entries.length;
          return;
        }

        this.chip_limit = Math.max(visible, 0);
      },

      car_img(carKey) {
        const skin = this.first_skin(carKey);
        if (!carKey || !skin) return "";
        return "/api/car/image/" + carKey + "/" + skin;
      },

      normalize(value) {
        return (value || "").toString().trim();
      },

      brand_options() {
        return [...new Set(this.cars.map((car) => this.normalize(car.brand)).filter(Boolean))]
          .sort((a, b) => a.localeCompare(b));
      },

      class_options() {
        return [...new Set(this.cars.map((car) => this.normalize(car.class)).filter(Boolean))]
          .sort((a, b) => a.localeCompare(b));
      },

      is_recent(unixSeconds) {
        if (!unixSeconds) return false;
        return (Date.now() / 1000) - unixSeconds <= 60 * 60 * 24 * 30;
      },

      relative_time(unixSeconds) {
        if (!unixSeconds) return "";
        const diffSeconds = Math.round(unixSeconds - (Date.now() / 1000));
        const abs = Math.abs(diffSeconds);
        const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
        if (abs < 3600) return rtf.format(Math.round(diffSeconds / 60), "minute");
        if (abs < 86400) return rtf.format(Math.round(diffSeconds / 3600), "hour");
        if (abs < 604800) return rtf.format(Math.round(diffSeconds / 86400), "day");
        if (abs < 2629800) return rtf.format(Math.round(diffSeconds / 604800), "week");
        return rtf.format(Math.round(diffSeconds / 2629800), "month");
      },

      updated_label(car) {
        return car.modified_at ? "Updated " + this.relative_time(car.modified_at) : "";
      },

      filtered() {
        const q = this.search.trim().toLowerCase();
        const items = this.cars.filter((c) => {
          const tags = (c.tags || []).join(" ").toLowerCase();
          const matchesSearch = !q || [c.name||"", c.key||"", c.brand||"", c.class||"", tags]
            .join(" ").toLowerCase().includes(q);
          const matchesBrand = this.brand_filter === "all" || this.normalize(c.brand) === this.brand_filter;
          const matchesClass = this.class_filter === "all" || this.normalize(c.class) === this.class_filter;
          const matchesQuick = this.quick_filter === "all"
            || (this.quick_filter === "selected" && this.is_selected(c.key))
            || (this.quick_filter === "recent" && this.is_recent(c.modified_at));
          return matchesSearch && matchesBrand && matchesClass && matchesQuick;
        });

        return items.slice().sort((a, b) => {
          if (this.sort_by === "recent") {
            const diff = (b.modified_at || 0) - (a.modified_at || 0);
            if (diff !== 0) return diff;
          }
          if (this.sort_by === "brand") {
            const diff = this.normalize(a.brand).localeCompare(this.normalize(b.brand));
            if (diff !== 0) return diff;
          }
          if (this.sort_by === "class") {
            const diff = this.normalize(a.class).localeCompare(this.normalize(b.class));
            if (diff !== 0) return diff;
          }
          return this.normalize(a.name || a.key).localeCompare(this.normalize(b.name || b.key));
        });
      },

      displayed() {
        return this.filtered().slice(0, this.render_count);
      },

      apply() {
        if (this.entries.length === 0) { this.notice = "Select at least one car."; return; }
        if (!this.current_event_id) { this.notice = "No running or queued event available."; return; }
        this.saving = true;
        this.notice = "";
        fetch("/api/server/current-event", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-CSRF-Token": (document.cookie.match(/(?:^|; )csrf_token=([^;]+)/) || [])[1] || "" },
          body: JSON.stringify({
            event_id: this.current_event_id,
            class_entries: this.entries,
            restart_now: this.is_running
          })
        })
          .then((r) => r.json().then((b) => ({ ok: r.ok, b })))
          .then(({ ok, b }) => {
            this.saving = false;
            if (!ok || b.success === false) {
              this.notice = (b && b.message) || "Could not update cars.";
              return;
            }
            window.location.href = "/mobile";
          })
          .catch(() => {
            this.saving = false;
            this.notice = "Could not update cars.";
          });
      }
    };
  }
</script>

<div class="mob-page" x-data="carsPage()" x-init="init()">

  <!-- Nav -->
  <div class="mob-page__nav">
    <a class="mob-page__back" href="/mobile">
      <i class="fas fa-arrow-left"></i> Back
    </a>
    <div class="mob-page__title">Change Cars</div>
    <div class="mob-page__meta" x-text="filtered().length + ' shown'"></div>
  </div>

  <!-- Selected chips -->
  <div class="mob-chips" :class="{ 'is-expanded': show_all_chips }" x-show="entries.length > 0" x-ref="chipWrap">
    <template x-for="entry in chip_entries()" :key="entry.cache_car_key">
      <div class="mob-chip">
        <span x-text="car_name(entry.cache_car_key)"></span>
        <button class="mob-chip__remove" type="button"
          @click="remove(entry.cache_car_key)" title="Remove">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </template>
    <button
      class="mob-chip mob-chip--more"
      type="button"
      x-show="hidden_chip_count() > 0"
      @click="show_all_chips = true; $nextTick(() => measure_chip_limit())"
      x-text="hidden_chip_count() + ' more'"></button>
    <button
      class="mob-chip mob-chip--more"
      type="button"
      x-show="show_all_chips && entries.length > 1"
      @click="show_all_chips = false; $nextTick(() => measure_chip_limit())">Show less</button>
  </div>

  <div class="mob-chip-measure" aria-hidden="true" x-ref="chipMeasure">
    <template x-for="entry in entries" :key="'measure-' + entry.cache_car_key">
      <div class="mob-chip" data-chip-measure>
        <span x-text="car_name(entry.cache_car_key)"></span>
        <button class="mob-chip__remove" type="button" tabindex="-1">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </template>
    <button class="mob-chip mob-chip--more" type="button" x-ref="chipMeasureMore">99 more</button>
  </div>

  <!-- Search -->
  <div class="mob-page__search">
    <input class="mob-search" type="search" x-model="search"
      placeholder="Search cars…" autocomplete="off" autofocus />
    <div class="mob-filterbar">
      <label class="mob-select-wrap">
        <span class="mob-select-wrap__label">Sort</span>
        <select class="mob-select" x-model="sort_by" aria-label="Sort cars">
          <option value="name">Name A-Z</option>
          <option value="recent">Recently updated</option>
          <option value="brand">Brand A-Z</option>
          <option value="class">Class A-Z</option>
        </select>
      </label>
      <label class="mob-select-wrap">
        <span class="mob-select-wrap__label">Brand</span>
        <select class="mob-select" x-model="brand_filter" aria-label="Filter cars by brand">
          <option value="all">All brands</option>
          <template x-for="brand in brand_options()" :key="brand">
            <option :value="brand" x-text="brand"></option>
          </template>
        </select>
      </label>
      <label class="mob-select-wrap">
        <span class="mob-select-wrap__label">Class</span>
        <select class="mob-select" x-model="class_filter" aria-label="Filter cars by class">
          <option value="all">All classes</option>
          <template x-for="group in class_options()" :key="group">
            <option :value="group" x-text="group"></option>
          </template>
        </select>
      </label>
    </div>
    <div class="mob-filterchips" role="group" aria-label="Quick car filters">
      <button class="mob-filterchip" type="button" :class="{ 'is-on': quick_filter === 'all' }" @click="quick_filter = 'all'">All</button>
      <button class="mob-filterchip" type="button" :class="{ 'is-on': quick_filter === 'selected' }" @click="quick_filter = 'selected'">Selected</button>
      <button class="mob-filterchip" type="button" :class="{ 'is-on': quick_filter === 'recent' }" @click="quick_filter = 'recent'">Updated 30d</button>
    </div>
  </div>

  <!-- List -->
  <div class="mob-page__body" x-ref="resultsBody">
    <template x-for="car in displayed()" :key="car.key">
      <button class="mob-choice" type="button"
        :class="{ 'is-on': is_selected(car.key) }"
        @click="toggle(car)">
        <img class="mob-choice__img" loading="lazy"
          :src="car_img(car.key)"
          :alt="car.name || car.key"
          @error="$el.style.visibility='hidden'" />
        <div class="mob-choice__body">
          <span class="mob-choice__name" x-text="car.name || car.key"></span>
          <span class="mob-choice__meta"
            x-text="[car.brand || '', car.class || ''].filter(Boolean).join(' · ')"></span>
          <span class="mob-choice__submeta" x-text="updated_label(car)"></span>
        </div>
        <span class="mob-choice__check"><i class="fas fa-check"></i></span>
      </button>
    </template>
    <template x-if="filtered().length === 0">
      <div class="mob-page__empty">No cars match the current search or filters.</div>
    </template>
    <div class="mob-page__lazy-sentinel" x-show="displayed().length < filtered().length" x-ref="renderMore">
      Loading more cars…
    </div>
  </div>

  <!-- Footer -->
  <div class="mob-page__footer">
    <template x-if="notice">
      <div class="mob-page__notice" x-text="notice"></div>
    </template>
    <a class="mob-btn mob-btn--ghost" href="/mobile">Cancel</a>
    <button class="mob-btn mob-btn--primary" type="button"
      @click="apply()" :disabled="saving || entries.length === 0"
      x-text="saving ? 'Applying…' : 'Apply cars'"></button>
  </div>

</div>

</body>
</html>
