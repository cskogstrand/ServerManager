<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ServerManager — Sign In</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  <meta name="author" content="8bitmcu" />

  <link href="/static/css/main.css" rel="stylesheet" />
  <link href="/static/css/extra.css" rel="stylesheet" />
</head>

<body>
  <div class="pw-login-page">
    <div class="pw-login-card">
      <div class="pw-login-card__stripe"></div>

      <div class="pw-login-card__header">
        <img class="pw-login-card__logo" src="/static/img/logo.png" alt="ServerManager" />
        <div class="pw-login-card__title">ServerManager</div>
        <div class="pw-login-card__sub">Assetto Corsa · Race Control</div>
      </div>

      <div class="pw-login-card__body">
        <form method="POST" action="/login">
          <div class="pw-login-form__row">
            <label class="pw-label" for="name">Username</label>
            <input
              class="pw-input pw-input--full"
              id="name"
              name="name"
              type="text"
              placeholder="Username"
              aria-label="Username"
              autocomplete="username"
              value=""
            />
          </div>
          <div class="pw-login-form__row">
            <label class="pw-label" for="password">Password</label>
            <input
              class="pw-input pw-input--full"
              id="password"
              name="password"
              type="password"
              placeholder="Password"
              aria-label="Password"
              autocomplete="current-password"
            />
          </div>
          <div style="margin-top: 24px;">
            <button type="submit" class="pw-btn pw-btn--primary pw-input--full" style="max-width: 100%; width: 100%; justify-content: center; padding: 10px 16px; font-size: 13px;">
              Sign In
            </button>
          </div>
        </form>
        {{ if .debug }}
        <div style="margin-top: 18px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.08);">
          <div class="pw-label" style="margin-bottom: 6px;">Debug Demo Account</div>
          <div style="font-size: 12px; color: var(--c-text-dim); line-height: 1.5;">
            Use <strong>demo</strong> / <strong>demo</strong> to browse the full UI even when the server setup is incomplete.
          </div>
        </div>
        {{ end }}
      </div>
    </div>
  </div>
</body>

</html>
