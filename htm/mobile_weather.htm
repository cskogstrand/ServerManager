<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Weather · ServerManager</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link href="/static/css/main.css" rel="stylesheet" />
  <link href="/static/css/extra.css" rel="stylesheet" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/js/all.min.js" crossorigin="anonymous"></script>
</head>
<body class="mob-page-body">

<script>
  function weatherPage() {
    return {
      weathers: {{ .weather_data }},
      selected: "",
      current_raw: "",
      csp_time: "12:00",
      csp_time_multi: 1,
      has_csp: false,
      search: "",
      saving: false,
      notice: "",
      current_event_id: 0,
      is_running: false,

      multipliers: [1, 2, 4, 6, 8, 16, 32],

      init() {
        fetch("/api/server/status")
          .then((r) => r.json())
          .then((j) => {
            this.is_running = j.is_running || false;
            const ev = j.current_event || {};
            this.current_event_id = ev.id || 0;
            this.current_raw = (j.session || {}).weather_graphics || "";
            this.selected = this.current_raw;
            const p = this.parse_weather(this.current_raw);
            if (p.time) { this.csp_time = p.time; this.has_csp = true; }
            if (p.mult_raw > 1) this.csp_time_multi = p.mult_raw;
            this.$nextTick(() => {
              const el = document.querySelector(".mob-choice.is-on");
              if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
            });
          });
      },

      // Returns { name, time "HH:MM", mult "2×", mult_raw 2 }
      parse_weather(str) {
        if (!str) return { name: "", time: "", mult: "", mult_raw: 1 };
        const hasCsp = str.includes("time=") || str.includes("mult=");
        if (!hasCsp) return { name: str, time: "", mult: "", mult_raw: 1 };
        const sp = str.indexOf(" ");
        const key = sp >= 0 ? str.slice(0, sp) : str;
        const name = sp >= 0 ? str.slice(sp + 1).trim() : "";
        let time = "", mult = "", mult_raw = 1;
        const tm = key.match(/time=(\d+)/);
        if (tm) {
          const s = parseInt(tm[1]);
          const h = Math.floor(s / 3600);
          const m = Math.floor((s % 3600) / 60);
          time = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
        }
        const ml = key.match(/mult=(\d+(?:\.\d+)?)/);
        if (ml) {
          mult_raw = parseFloat(ml[1]);
          if (mult_raw !== 1) mult = mult_raw + "×";
        }
        return { name, time, mult, mult_raw };
      },

      weather_name(w) {
        const p = this.parse_weather(w.name || w.key);
        return p.name || w.name || w.key;
      },

      weather_meta(w) {
        const p = this.parse_weather(w.name || w.key);
        return [p.time, p.mult].filter(Boolean).join(" · ");
      },

      current_label() {
        const p = this.parse_weather(this.current_raw);
        return [p.name, p.time, p.mult].filter(Boolean).join(" · ") || this.current_raw;
      },

      filtered() {
        const q = this.search.trim().toLowerCase();
        if (!q) return this.weathers;
        return this.weathers.filter((w) =>
          [w.name||"", w.key||""].join(" ").toLowerCase().includes(q)
        );
      },

      preview(key) {
        return "/api/weather/preview/" + key;
      },

      apply() {
        if (!this.selected) { this.notice = "Select a weather first."; return; }
        if (!this.current_event_id) { this.notice = "No running or queued event available."; return; }
        this.saving = true;
        this.notice = "";
        const payload = {
          event_id: this.current_event_id,
          weather_key: this.selected,
          restart_now: this.is_running
        };
        if (this.has_csp) {
          payload.csp_time = this.csp_time;
          payload.csp_time_multi = this.csp_time_multi;
        }
        fetch("/api/server/current-event", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        })
          .then((r) => r.json().then((b) => ({ ok: r.ok, b })))
          .then(({ ok, b }) => {
            this.saving = false;
            if (!ok || b.success === false) {
              this.notice = (b && b.message) || "Could not update weather.";
              return;
            }
            window.location.href = "/mobile";
          })
          .catch(() => {
            this.saving = false;
            this.notice = "Could not update weather.";
          });
      }
    };
  }
</script>

<div class="mob-page" x-data="weatherPage()" x-init="init()">

  <!-- Nav -->
  <div class="mob-page__nav">
    <a class="mob-page__back" href="/mobile">
      <i class="fas fa-arrow-left"></i> Back
    </a>
    <div class="mob-page__title">Change Weather</div>
    <div class="mob-page__meta" x-text="filtered().length + ' options'"></div>
  </div>

  <!-- Current selection banner -->
  <div class="mob-page__current-banner" x-show="current_raw">
    <i class="fas fa-cloud-sun" style="color:#2563eb;font-size:11px;flex-shrink:0;"></i>
    <span class="mob-page__current-lbl">Current</span>
    <span class="mob-page__current-val" x-text="current_label()"></span>
  </div>

  <!-- Time of day & multiplier controls -->
  <div class="mob-page__controls" x-show="has_csp">
    <div class="mob-page__ctrl">
      <span class="mob-page__ctrl-lbl">
        <i class="fas fa-clock" style="font-size:10px;opacity:0.6;"></i>
        Time of day
      </span>
      <input class="mob-time-input" type="time" x-model="csp_time" />
    </div>
    <div class="mob-page__ctrl">
      <span class="mob-page__ctrl-lbl">
        <i class="fas fa-tachometer-alt" style="font-size:10px;opacity:0.6;"></i>
        Speed
      </span>
      <div class="mob-mults">
        <template x-for="m in multipliers" :key="m">
          <button class="mob-mult-btn" type="button"
            :class="{ 'is-on': csp_time_multi === m }"
            @click="csp_time_multi = m"
            x-text="m + '×'"></button>
        </template>
      </div>
    </div>
  </div>

  <!-- Search -->
  <div class="mob-page__search">
    <input class="mob-search" type="search" x-model="search"
      placeholder="Search weather…" autocomplete="off" />
  </div>

  <!-- List -->
  <div class="mob-page__body">
    <template x-for="weather in filtered()" :key="weather.key">
      <button class="mob-choice" type="button"
        :class="{ 'is-on': selected === weather.key }"
        @click="selected = weather.key">
        <img class="mob-choice__img" loading="lazy"
          :src="preview(weather.key)"
          :alt="weather.name || weather.key"
          @error="$el.style.visibility='hidden'" />
        <div class="mob-choice__body">
          <span class="mob-choice__name" x-text="weather_name(weather)"></span>
          <span class="mob-choice__meta" x-text="weather_meta(weather)"></span>
        </div>
        <span class="mob-choice__check"><i class="fas fa-check"></i></span>
      </button>
    </template>
    <template x-if="filtered().length === 0">
      <div class="mob-page__empty">No weather options match your search.</div>
    </template>
  </div>

  <!-- Footer -->
  <div class="mob-page__footer">
    <template x-if="notice">
      <div class="mob-page__notice" x-text="notice"></div>
    </template>
    <a class="mob-btn mob-btn--ghost" href="/mobile">Cancel</a>
    <button class="mob-btn mob-btn--primary" type="button"
      @click="apply()" :disabled="saving || !selected"
      x-text="saving ? 'Applying…' : 'Apply weather'"></button>
  </div>

</div>

</body>
</html>
