[SERVER]
NAME={{ if .instance.Name }}{{ defaultStr .instance.Name "" }}{{ else }}{{ defaultStr .config.Name "" }}{{ end }}{{ if (eq (derefInt .config.AppendEventname) 1) }} - {{ .name }}{{ end }}
CARS={{range $i, $val := .class.Entries }}{{ if (gt $i 0)}};{{ end }}{{ $val.CacheCarKey }}{{ end }}
CONFIG_TRACK={{ defaultStr .track.Config "" }}
TRACK={{ .cspstr }}{{ .track.Key }}
SUN_ANGLE={{ .sunangle }}
PASSWORD={{ defaultStr .config.Password "" }}
ADMIN_PASSWORD={{ defaultStr .config.AdminPassword "" }}
UDP_PORT={{ defaultInt .instance.UdpPort (defaultInt .config.UdpPort 9600) }}
TCP_PORT={{ defaultInt .instance.TcpPort (defaultInt .config.TcpPort 9600) }}
HTTP_PORT={{ defaultInt .instance.HttpPort (defaultInt .config.HttpPort 8081) }}
MAX_BALLAST_KG={{ defaultInt .diff.MaxBallastKg 0 }}
QUALIFY_MAX_WAIT_PERC={{ defaultInt .session.QualifyMaxWaitPerc 120 }}
RACE_PIT_WINDOW_START={{ defaultInt .session.RacePitWindowStart 0 }}
RACE_PIT_WINDOW_END={{ defaultInt .session.RacePitWindowEnd 0 }}
REVERSED_GRID_RACE_POSITIONS={{ defaultInt .session.ReversedGridPositions 0 }}
LOCKED_ENTRY_LIST={{ defaultInt .config.LockedEntryList 0 }}
PICKUP_MODE_ENABLED={{ if (eq (derefInt .session.BookingEnabled) 1) }}0{{ else }}1{{ end }}
LOOP_MODE=0
SLEEP_TIME=1
CLIENT_SEND_INTERVAL_HZ={{ defaultInt .config.ClientSendInterval 0 }}
SEND_BUFFER_SIZE=0
RECV_BUFFER_SIZE=0
RACE_OVER_TIME={{ defaultInt .session.RaceOverTime 0 }}
KICK_QUORUM={{ defaultInt .diff.KickQuorum 0 }}
VOTING_QUORUM={{ defaultInt .diff.VotingQuorum 0 }}
VOTE_DURATION={{ defaultInt .diff.VoteDuration 0 }}
BLACKLIST_MODE={{ defaultInt .diff.BlacklistMode 0 }}
FUEL_RATE={{ defaultInt .diff.FuelRate 0 }}
DAMAGE_MULTIPLIER={{ defaultInt .diff.DamageMultiplier 0 }}
TYRE_WEAR_RATE={{ defaultInt .diff.TyreWearRate 0 }}
ALLOWED_TYRES_OUT={{ defaultInt .diff.AllowedTyresOut 0 }}
ABS_ALLOWED={{ defaultInt .diff.AbsAllowed 0 }}
TC_ALLOWED={{ defaultInt .diff.TcAllowed 0 }}
START_RULE={{ defaultInt .diff.StartRule 0 }}
RACE_GAS_PENALTY_DISABLED={{ defaultInt .diff.RaceGasPenalityDisabled 0 }}
TIME_OF_DAY_MULT={{ defaultInt .time.TimeOfDayMulti 0 }}
RESULT_SCREEN_TIME={{ defaultInt .config.ResultScreenTime 0 }}
MAX_CONTACTS_PER_KM={{ defaultInt .diff.MaxContactsPerKm 0 }}
STABILITY_ALLOWED={{ defaultInt .diff.StabilityAllowed 0 }}
AUTOCLUTCH_ALLOWED={{ defaultInt .diff.AutoclutchAllowed 0 }}
TYRE_BLANKETS_ALLOWED={{ defaultInt .diff.TyreBlanketsAllowed 0 }}
FORCE_VIRTUAL_MIRROR={{ defaultInt .diff.ForceVirtualMirror 0 }}
REGISTER_TO_LOBBY={{ defaultInt .config.RegisterToLobby 0 }}
MAX_CLIENTS={{ .max_clients }}
NUM_THREADS={{ defaultInt .config.NumThreads 0 }}
UDP_PLUGIN_LOCAL_PORT={{ defaultInt .instance.PluginPort 5000 }}
UDP_PLUGIN_ADDRESS=127.0.0.1:{{ defaultInt .instance.PluginListenPort 5001 }}
AUTH_PLUGIN_ADDRESS=
LEGAL_TYRES=
RACE_EXTRA_LAP={{ defaultInt .session.RaceExtraLap 0 }}
WELCOME_MESSAGE={{ defaultStr .config.WelcomeMessage "" }}
{{ if (gt (derefInt .session.BookingEnabled) 0) }}
[BOOK]
NAME=Booking
TIME={{ defaultInt .session.BookingTime 0 }}
{{ end }}
{{ if (gt (derefInt .session.PracticeEnabled) 0) }}
[PRACTICE]
NAME=Practice
TIME={{ defaultInt .session.PracticeTime 0 }}
IS_OPEN={{ defaultInt .session.PracticeIsOpen 0 }}
{{ end }}
{{ if (gt (derefInt .session.QualifyEnabled) 0) }}
[QUALIFY]
NAME=Qualify
TIME={{ defaultInt .session.QualifyTime 0 }}
IS_OPEN={{ defaultInt .session.QualifyIsOpen 0 }}
{{ end }}
{{ if (gt (derefInt .session.RaceEnabled) 0) }}
[RACE]
NAME=Race
{{ if (gt (derefInt .event.RaceLaps) 0) }}
LAPS={{ defaultInt .event.RaceLaps 0 }}
{{ else }}
TIME={{ defaultInt .session.RaceTime 0 }}
{{ end }}
WAIT_TIME={{ defaultInt .session.RaceWaitTime 0 }}
IS_OPEN={{ defaultInt .session.RaceIsOpen 0 }}
{{ end }}
{{ if (gt (derefInt .diff.DynamicTrack) 0) }}
[DYNAMIC_TRACK]
SESSION_START={{ defaultInt .diff.SessionStart 0 }}
RANDOMNESS={{ defaultInt .diff.Randomness 0 }}
SESSION_TRANSFER={{ defaultInt .diff.SessionTransfer 0 }}
LAP_GAIN={{ defaultInt .diff.LapGain 0 }}
{{ end }}
{{range $i, $val := .time.Weathers }}
[WEATHER_{{ $i }}]
GRAPHICS={{ defaultStr $val.Graphics "" }}
BASE_TEMPERATURE_AMBIENT={{ defaultInt $val.BaseTemperatureAmbient 0 }}
BASE_TEMPERATURE_ROAD={{ defaultInt $val.BaseTemperatureRoad 0 }}
VARIATION_AMBIENT={{ defaultInt $val.VariationAmbient 0 }}
VARIATION_ROAD={{ defaultInt $val.VariationRoad 0 }}
WIND_BASE_SPEED_MIN={{ defaultInt $val.WindBaseSpeedMin 0 }}
WIND_BASE_SPEED_MAX={{ defaultInt $val.WindBaseSpeedMax 0 }}
WIND_BASE_DIRECTION={{ defaultInt $val.WindBaseDirection 0 }}
WIND_VARIATION_DIRECTION={{ defaultInt $val.WindVariationDirection 0 }}
{{ end }}
{{ if or (gt (len (defaultStr .config.WelcomeMessage "")) 0) (eq (derefInt .config.AppendModlinks) 1) }}
[DATA]
WELCOME_PATH=welcome.txt
{{ end }}
