<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Track · ServerManager</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link href="/static/css/main.css" rel="stylesheet" />
  <link href="/static/css/extra.css" rel="stylesheet" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/js/all.min.js" crossorigin="anonymous"></script>
</head>
<body class="mob-page-body">

<script>
  function trackPage() {
    return {
      tracks: {{ .track_data }},
      selected: "",
      search: "",
      sort_by: "name",
      country_filter: "all",
      quick_filter: "all",
      saving: false,
      notice: "",
      current_event_id: 0,
      is_running: false,

      init() {
        fetch("/api/server/status")
          .then((r) => r.json())
          .then((j) => {
            this.is_running = j.is_running || false;
            const ev = j.current_event || {};
            this.current_event_id = ev.id || 0;
            const key = ev.track_key || (j.session || {}).track || "";
            const cfg = ev.track_config || (j.session || {}).track_config || "";
            this.selected = key ? key + ":" + cfg : "";
            this.$nextTick(() => {
              const el = document.querySelector(".mob-choice.is-on");
              if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
            });
          });
      },

      track_value(track) {
        return track.key + ":" + (track.config || "");
      },

      selected_track() {
        return this.tracks.find((t) => this.track_value(t) === this.selected) || null;
      },

      selected_label() {
        const t = this.selected_track();
        if (!t) return "";
        const parts = [t.name || t.key];
        if (t.config) parts.push(t.config);
        if (t.country) parts.push(t.country);
        return parts.join(" · ");
      },

      normalize(value) {
        return (value || "").toString().trim();
      },

      country_options() {
        return [...new Set(this.tracks.map((track) => this.normalize(track.country)).filter(Boolean))]
          .sort((a, b) => a.localeCompare(b));
      },

      is_recent(unixSeconds) {
        if (!unixSeconds) return false;
        return (Date.now() / 1000) - unixSeconds <= 60 * 60 * 24 * 30;
      },

      relative_time(unixSeconds) {
        if (!unixSeconds) return "";
        const diffSeconds = Math.round(unixSeconds - (Date.now() / 1000));
        const abs = Math.abs(diffSeconds);
        const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
        if (abs < 3600) return rtf.format(Math.round(diffSeconds / 60), "minute");
        if (abs < 86400) return rtf.format(Math.round(diffSeconds / 3600), "hour");
        if (abs < 604800) return rtf.format(Math.round(diffSeconds / 86400), "day");
        if (abs < 2629800) return rtf.format(Math.round(diffSeconds / 604800), "week");
        return rtf.format(Math.round(diffSeconds / 2629800), "month");
      },

      updated_label(track) {
        return track.modified_at ? "Updated " + this.relative_time(track.modified_at) : "";
      },

      length_label(track) {
        if (!track.length) return "";
        return (track.length / 1000).toFixed(1) + " km";
      },

      filtered() {
        const q = this.search.trim().toLowerCase();
        const items = this.tracks.filter((t) => {
          const tags = (t.tags || []).join(" ").toLowerCase();
          const matchesSearch = !q || [t.name||"", t.key||"", t.config||"", t.country||"", t.city||"", tags]
            .join(" ").toLowerCase().includes(q);
          const matchesCountry = this.country_filter === "all" || this.normalize(t.country) === this.country_filter;
          const matchesQuick = this.quick_filter === "all"
            || (this.quick_filter === "selected" && this.selected === this.track_value(t))
            || (this.quick_filter === "recent" && this.is_recent(t.modified_at));
          return matchesSearch && matchesCountry && matchesQuick;
        });

        return items.slice().sort((a, b) => {
          if (this.sort_by === "recent") {
            const diff = (b.modified_at || 0) - (a.modified_at || 0);
            if (diff !== 0) return diff;
          }
          if (this.sort_by === "length") {
            const diff = (b.length || 0) - (a.length || 0);
            if (diff !== 0) return diff;
          }
          if (this.sort_by === "country") {
            const diff = this.normalize(a.country).localeCompare(this.normalize(b.country));
            if (diff !== 0) return diff;
          }
          return this.normalize(a.name || a.key).localeCompare(this.normalize(b.name || b.key));
        });
      },

      preview(key, config) {
        if (!config) return "/api/track/preview/" + key;
        return "/api/track/preview/" + key + "/" + config;
      },

      apply() {
        if (!this.selected) { this.notice = "Select a track first."; return; }
        if (!this.current_event_id) { this.notice = "No running or queued event available."; return; }
        this.saving = true;
        this.notice = "";
        fetch("/api/server/current-event", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            event_id: this.current_event_id,
            track: this.selected,
            restart_now: this.is_running
          })
        })
          .then((r) => r.json().then((b) => ({ ok: r.ok, b })))
          .then(({ ok, b }) => {
            this.saving = false;
            if (!ok || b.success === false) {
              this.notice = (b && b.message) || "Could not update track.";
              return;
            }
            window.location.href = "/mobile";
          })
          .catch(() => {
            this.saving = false;
            this.notice = "Could not update track.";
          });
      }
    };
  }
</script>

<div class="mob-page" x-data="trackPage()" x-init="init()">

  <!-- Nav -->
  <div class="mob-page__nav">
    <a class="mob-page__back" href="/mobile">
      <i class="fas fa-arrow-left"></i> Back
    </a>
    <div class="mob-page__title">Change Track</div>
    <div class="mob-page__meta" x-text="filtered().length + ' tracks'"></div>
  </div>

  <!-- Current selection banner -->
  <div class="mob-page__current-banner" x-show="selected">
    <i class="fas fa-map-marker-alt" style="color:#2563eb;font-size:11px;flex-shrink:0;"></i>
    <span class="mob-page__current-lbl">Current</span>
    <span class="mob-page__current-val" x-text="selected_label()"></span>
  </div>

  <!-- Search -->
  <div class="mob-page__search">
    <input class="mob-search" type="search" x-model="search"
      placeholder="Search tracks…" autocomplete="off" autofocus />
    <div class="mob-filterbar">
      <label class="mob-select-wrap">
        <span class="mob-select-wrap__label">Sort</span>
        <select class="mob-select" x-model="sort_by" aria-label="Sort tracks">
          <option value="name">Name A-Z</option>
          <option value="recent">Recently updated</option>
          <option value="length">Longest first</option>
          <option value="country">Country A-Z</option>
        </select>
      </label>
      <label class="mob-select-wrap">
        <span class="mob-select-wrap__label">Country</span>
        <select class="mob-select" x-model="country_filter" aria-label="Filter tracks by country">
          <option value="all">All countries</option>
          <template x-for="country in country_options()" :key="country">
            <option :value="country" x-text="country"></option>
          </template>
        </select>
      </label>
    </div>
    <div class="mob-filterchips" role="group" aria-label="Quick track filters">
      <button class="mob-filterchip" type="button" :class="{ 'is-on': quick_filter === 'all' }" @click="quick_filter = 'all'">All</button>
      <button class="mob-filterchip" type="button" :class="{ 'is-on': quick_filter === 'selected' }" @click="quick_filter = 'selected'">Current</button>
      <button class="mob-filterchip" type="button" :class="{ 'is-on': quick_filter === 'recent' }" @click="quick_filter = 'recent'">Updated 30d</button>
    </div>
  </div>

  <!-- List -->
  <div class="mob-page__body">
    <template x-for="track in filtered()" :key="track_value(track)">
      <button class="mob-choice" type="button"
        :class="{ 'is-on': selected === track_value(track) }"
        @click="selected = track_value(track)">
        <img class="mob-choice__img" loading="lazy"
          :src="preview(track.key, track.config)"
          :alt="track.name || track.key" />
        <div class="mob-choice__body">
          <span class="mob-choice__name" x-text="track.name || track.key"></span>
          <span class="mob-choice__meta"
            x-text="[track.config || 'default', track.country || '', track.city || ''].filter(Boolean).join(' · ')"></span>
          <span class="mob-choice__submeta"
            x-text="[length_label(track), updated_label(track)].filter(Boolean).join(' · ')"></span>
        </div>
        <span class="mob-choice__check"><i class="fas fa-check"></i></span>
      </button>
    </template>
    <template x-if="filtered().length === 0">
      <div class="mob-page__empty">No tracks match the current search or filters.</div>
    </template>
  </div>

  <!-- Footer -->
  <div class="mob-page__footer">
    <template x-if="notice">
      <div class="mob-page__notice" x-text="notice"></div>
    </template>
    <a class="mob-btn mob-btn--ghost" href="/mobile">Cancel</a>
    <button class="mob-btn mob-btn--primary" type="button"
      @click="apply()" :disabled="saving || !selected"
      x-text="saving ? 'Applying…' : 'Apply track'"></button>
  </div>

</div>

</body>
</html>
