<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Weather · ServerManager</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link href="/static/css/main.css" rel="stylesheet" />
  <link href="/static/css/extra.css" rel="stylesheet" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/js/all.min.js" crossorigin="anonymous"></script>
</head>
<body class="mob-page-body">

<script>
  function weatherPage() {
    return {
      weathers: {{ .weather_data }},
      selected: "",
      search: "",
      saving: false,
      notice: "",
      current_event_id: 0,
      is_running: false,

      init() {
        fetch("/api/server/status")
          .then((r) => r.json())
          .then((j) => {
            this.is_running = j.is_running || false;
            const ev = j.current_event || {};
            this.current_event_id = ev.id || 0;
            this.selected = (j.session || {}).weather_graphics || "";
          });
      },

      filtered() {
        const q = this.search.trim().toLowerCase();
        if (!q) return this.weathers;
        return this.weathers.filter((w) =>
          [w.name||"", w.key||""].join(" ").toLowerCase().includes(q)
        );
      },

      preview(key) {
        return "/api/weather/preview/" + key;
      },

      apply() {
        if (!this.selected) { this.notice = "Select a weather first."; return; }
        if (!this.current_event_id) { this.notice = "No running or queued event available."; return; }
        this.saving = true;
        this.notice = "";
        fetch("/api/server/current-event", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            event_id: this.current_event_id,
            weather_key: this.selected,
            restart_now: this.is_running
          })
        })
          .then((r) => r.json().then((b) => ({ ok: r.ok, b })))
          .then(({ ok, b }) => {
            this.saving = false;
            if (!ok || b.success === false) {
              this.notice = (b && b.message) || "Could not update weather.";
              return;
            }
            window.location.href = "/mobile";
          })
          .catch(() => {
            this.saving = false;
            this.notice = "Could not update weather.";
          });
      }
    };
  }
</script>

<div class="mob-page" x-data="weatherPage()" x-init="init()">

  <!-- Nav -->
  <div class="mob-page__nav">
    <a class="mob-page__back" href="/mobile">
      <i class="fas fa-arrow-left"></i> Back
    </a>
    <div class="mob-page__title">Change Weather</div>
    <div class="mob-page__meta" x-text="filtered().length + ' options'"></div>
  </div>

  <!-- Search -->
  <div class="mob-page__search">
    <input class="mob-search" type="search" x-model="search"
      placeholder="Search weather…" autocomplete="off" autofocus />
  </div>

  <!-- Grid -->
  <div class="mob-page__body">
    <div class="mob-page__grid">
      <template x-for="weather in filtered()" :key="weather.key">
        <button class="mob-choice mob-choice--grid" type="button"
          :class="{ 'is-on': selected === weather.key }"
          @click="selected = weather.key">
          <div class="mob-choice__thumb" x-data="{ broken: false }">
            <img loading="lazy" x-show="!broken"
              :src="preview(weather.key)"
              :alt="weather.name || weather.key"
              @error="broken = true" />
            <div x-show="broken" class="mob-choice__thumb-fallback">
              <i class="fas fa-cloud-sun-rain"></i>
            </div>
            <i class="fas fa-check mob-choice--grid__check"></i>
          </div>
          <span class="mob-choice__name" x-text="weather.name || weather.key"></span>
          <span class="mob-choice__meta" x-text="weather.key"></span>
        </button>
      </template>
    </div>
    <template x-if="filtered().length === 0">
      <div class="mob-page__empty">No weather options match your search.</div>
    </template>
  </div>

  <!-- Footer -->
  <div class="mob-page__footer">
    <template x-if="notice">
      <div class="mob-page__notice" x-text="notice"></div>
    </template>
    <a class="mob-btn mob-btn--ghost" href="/mobile">Cancel</a>
    <button class="mob-btn mob-btn--primary" type="button"
      @click="apply()" :disabled="saving || !selected"
      x-text="saving ? 'Applying…' : 'Apply weather'"></button>
  </div>

</div>

</body>
</html>
