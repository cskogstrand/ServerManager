services:
  servermanager-dev:
    container_name: assetto-server-manager-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /go/src/app
    volumes:
      - ./:/go/src/app
      - servermanager_dev_node_modules:/go/src/app/node_modules
      - servermanager_dev_go_mod_cache:/go/pkg/mod
      - servermanager_dev_go_build_cache:/root/.cache/go-build
      - ${APP_PATH:-./}/assetocorsa:/corsa/:ro
      - ${APP_PATH:-./}/assetocorsa/content:/corsa/content:rw
      - ${APP_PATH:-./}/data:/appdata/:rw
    ports:
      - 3030:3030
      - ${AC_TCP_PORT:-9600}:9600/tcp
      - ${AC_UDP_PORT:-9600}:9600/udp
      - ${AC_HTTP_PORT:-8081}:8081/tcp
      # Extra server instances (multi-server) bind their own ports inside the
      # container; map them 1:1 so they are reachable from the host.
      - 9601-9609:9601-9609/tcp
      - 9601-9609:9601-9609/udp
      - 8082-8090:8082-8090/tcp

volumes:
  servermanager_dev_node_modules:
  servermanager_dev_go_mod_cache:
  servermanager_dev_go_build_cache:
